<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0B0E14" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#222B3D" stroke-width="8" />

  <!-- Dumbbell Graphic -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Central Bar -->
    <rect x="140" y="236" width="232" height="40" rx="12" fill="#F9FAFB" />
    <!-- Bar Knurling Marks -->
    <rect x="210" y="234" width="92" height="44" rx="6" fill="#10B981" opacity="0.8" />
    <line x1="236" y1="234" x2="236" y2="278" stroke="#0B0E14" stroke-width="4" />
    <line x1="256" y1="234" x2="256" y2="278" stroke="#0B0E14" stroke-width="4" />
    <line x1="276" y1="234" x2="276" y2="278" stroke="#0B0E14" stroke-width="4" />

    <!-- Left Inner Weight Plate -->
    <rect x="100" y="176" width="32" height="160" rx="14" fill="url(#emeraldGrad)" />
    <!-- Left Outer Weight Plate -->
    <rect x="52" y="196" width="36" height="120" rx="12" fill="#10B981" />
    <!-- Left Collar -->
    <rect x="132" y="216" width="12" height="80" rx="4" fill="#64748B" />

    <!-- Right Inner Weight Plate -->
    <rect x="380" y="176" width="32" height="160" rx="14" fill="url(#emeraldGrad)" />
    <!-- Right Outer Weight Plate -->
    <rect x="424" y="196" width="36" height="120" rx="12" fill="#10B981" />
    <!-- Right Collar -->
    <rect x="368" y="216" width="12" height="80" rx="4" fill="#64748B" />
  </g>
</svg>
